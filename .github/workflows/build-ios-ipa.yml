name: Build Folia iOS IPA (unsigned)

# 手动触发：Actions 标签页点 "Run workflow"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Inject env from GitHub Secrets
        run: |
          touch .env
          # 默认使用公共网易云 API 实例（已实测可用）
          # 如果你想换成自己部署的实例，在 GitHub Secret 里配 VITE_NETEASE_API_BASE 即可覆盖
          DEFAULT_NCM="https://api.neteasemusic.davidblackcn.online"
          NCM_VALUE="${{ secrets.VITE_NETEASE_API_BASE }}"
          if [ -z "$NCM_VALUE" ]; then NCM_VALUE="$DEFAULT_NCM"; fi
          echo "VITE_NETEASE_API_BASE=$NCM_VALUE" >> .env

          if [ -n "${{ secrets.VITE_KUGOU_API_BASE }}" ]; then
            echo "VITE_KUGOU_API_BASE=${{ secrets.VITE_KUGOU_API_BASE }}" >> .env
          fi
          if [ -n "${{ secrets.VITE_QQ_API_BASE }}" ]; then
            echo "VITE_QQ_API_BASE=${{ secrets.VITE_QQ_API_BASE }}" >> .env
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi
          echo "--- .env (不含敏感值) ---"
          sed 's/=.*/=***/' .env

      - name: Build web (capacitor target)
        run: npm run build:capacitor

      - name: Add / sync iOS project
        run: |
          if [ -d "ios" ]; then
            npx cap sync ios
          else
            npx cap add ios
            npx cap sync ios
          fi

      - name: iOS info
        run: |
          xcodebuild -version
          pod --version
          ls ios/App/

      - name: Pod install
        run: cd ios/App && pod install

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Folia.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: Pack ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Folia.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r "Folia-unsigned-$(date +%Y%m%d).ipa" Payload
          ls -lh "$RUNNER_TEMP"/*.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: folia-ios-unsigned
          path: ${{ runner.temp }}/*.ipa
          retention-days: 14
